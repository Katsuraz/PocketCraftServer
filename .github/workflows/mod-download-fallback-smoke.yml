name: Verify Fabric API fallback downloads
on:
  workflow_dispatch:
  push:
    paths:
      - app/src/main/java/com/pocketcraft/server/WebsiteModInstaller.kt
      - .github/workflows/mod-download-fallback-smoke.yml
permissions:
  contents: read
jobs:
  verify-fabric-api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Cross-check Modrinth metadata against official Fabric mirrors
        env:
          MC_VERSION: '26.3'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          game = os.environ["MC_VERSION"]
          params = urllib.parse.urlencode({
              "loaders": json.dumps(["fabric"]),
              "game_versions": json.dumps([game]),
              "include_changelog": "false",
          })
          endpoint = ("https://api.modrinth.com/v2/project/P7dR8mSH/version?" + params)
          headers = {
              "User-Agent": "Katsuraz/PocketCraftServer/0.8.16 (GitHub Actions fallback smoke)",
              "Accept": "application/json, application/octet-stream",
          }
          def read(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=35) as resp:
                  if int(resp.headers.get("Content-Length", "0")) > 30000000:
                      raise ValueError("Response too large")
                  data = resp.read(30000001)
                  if len(data) > 30000000:
                      raise ValueError("Response exceeds 30 MB")
                  return data

          versions = json.loads(read(endpoint))
          candidates = []
          for version in versions:
              v = version.get("version_number", "")
              if not re.fullmatch(r"[A-Za-z0-9._+-]{1,80}", v) or not v.endswith("+" + game):
                  continue
              for item in version.get("files", []):
                  name = item.get("filename", "")
                  sha = item.get("hashes", {}).get("sha512", "")
                  if name.startswith("fabric-api-") and name.endswith(".jar") and re.fullmatch("[0-9a-fA-F]{128}", sha):
                      candidates.append((v, name, sha.lower(), item.get("url", "")))
          if not candidates:
              raise SystemExit("No published Fabric API JAR with SHA512 for " + game)
          version, name, expected, modrinth_url = candidates[0]
          print("Selected Fabric API:", version, name)

          urls = {
              "GitHub official release":
                  "https://github.com/FabricMC/fabric-api/releases/download/" +
                  urllib.parse.quote(version, safe="") + "/" +
                  urllib.parse.quote(name, safe=""),
              "Fabric official Maven":
                  "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/" +
                  version + "/fabric-api-" + version + ".jar",
          }
          verified = []
          for label, url in urls.items():
              try:
                  blob = read(url)
                  actual = hashlib.sha512(blob).hexdigest()
                  if actual != expected:
                      print("::warning::" + label + " SHA512 differs from Modrinth")
                      continue
                  if blob[:2] != b"PK":
                      raise ValueError("Not a JAR archive")
                  verified.append(label)
                  print("PASS:", label, len(blob), "bytes, SHA512 matches")
              except Exception as exc:
                  print("::warning::" + label + " unreachable: " + str(exc))
          if not verified:
              raise SystemExit("No official Fabric API mirror matches Modrinth SHA512; fallback not verified")
          print("Verified download fallback:", ", ".join(verified))
          PY
