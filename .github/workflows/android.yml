name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Bundle Android ARM64 libc++ shared runtime
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          LIB="$(find "$NDK/toolchains/llvm/prebuilt" -path '*/aarch64-linux-android/libc++_shared.so' -type f -print -quit)"
          test -n "$LIB" && test -s "$LIB"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LIB" app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          file app/src/main/jniLibs/arm64-v8a/libc++_shared.so
      - name: Prepare persistent developer signing key
        env:
          POCKETCRAFT_KEYSTORE_BASE64: ${{ secrets.POCKETCRAFT_KEYSTORE_BASE64 }}
          POCKETCRAFT_SIGNING_PASSWORD: ${{ secrets.POCKETCRAFT_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$POCKETCRAFT_KEYSTORE_BASE64" && -n "$POCKETCRAFT_SIGNING_PASSWORD" ]]; then
            echo "$POCKETCRAFT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pocketcraft-updates.jks"
            chmod 600 "$RUNNER_TEMP/pocketcraft-updates.jks"
            keytool -list -keystore "$RUNNER_TEMP/pocketcraft-updates.jks" -storepass "$POCKETCRAFT_SIGNING_PASSWORD" -alias pocketcraft >/dev/null
            echo "POCKETCRAFT_SIGNING_KEYSTORE=$RUNNER_TEMP/pocketcraft-updates.jks" >> "$GITHUB_ENV"
            echo "POCKETCRAFT_SIGNING_PASSWORD=$POCKETCRAFT_SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "Persistent APK signing configured from GitHub Secrets"
          elif [[ -n "$POCKETCRAFT_KEYSTORE_BASE64" || -n "$POCKETCRAFT_SIGNING_PASSWORD" ]]; then
            echo "::error::Both POCKETCRAFT_KEYSTORE_BASE64 and POCKETCRAFT_SIGNING_PASSWORD must be provided."
            exit 1
          else
            echo "::warning::Persistent signing not configured. Debug APK will use runner-generated key and WILL NOT upgrade an APK signed on a different runner."
          fi
      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify ARM64 native runtime exists inside APK
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libc++_shared.so'
      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pocketcraft-debug-apk
          path: app/build/outputs/apk/debug/*.apk
