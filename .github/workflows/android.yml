name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prevent Android APK version downgrades
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          filename = "app/build.gradle.kts"
          pattern = re.compile(r"(?m)^\s*versionCode\s*=\s*(\d+)\s*$")
          def version_code(text):
              match = pattern.search(text)
              if not match:
                  raise ValueError("Missing versionCode in app/build.gradle.kts")
              return int(match.group(1))

          current = version_code(Path(filename).read_text())
          # 0.8.4 / code 26 is the last verified baseline after the
          # code 25 -> 21 downgrade incident. Git history catches later
          # accidental decreases as releases advance.
          highest_ever = 26
          commits = subprocess.check_output(
              ["git", "log", "--format=%H", "HEAD", "--", filename],
              text=True,
          ).splitlines()
          for commit in commits:
              prior = subprocess.check_output(
                  ["git", "show", f"{commit}:{filename}"], text=True
              )
              highest_ever = max(highest_ever, version_code(prior))

          print(f"Current versionCode: {current}; history floor: {highest_ever}")
          if current < highest_ever:
              print(f"::error::Android versionCode {current} is older than a previously committed code {highest_ever}. Increase it before publishing.")
              sys.exit(1)
          print("Android APK versionCode downgrade prevention passed")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # An external integration probe, deliberately non-blocking: Modrinth's
      # network can be down, but the Android app must still compile and test.
      - name: Probe official Modrinth Maven fallback for Lithostitched (diagnostic)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set +e
          PROJECT="XaDC71GB"
          RELEASE="pZgI6b2t"
          SRC="https://api.modrinth.com/maven/maven/modrinth/$PROJECT/$RELEASE/$PROJECT-$RELEASE.jar"
          echo "Probing immutable Modrinth Maven release for Fabric 26.3"
          curl --location --fail --silent --show-error \
            --connect-timeout 10 --max-time 35 \
            --output "$RUNNER_TEMP/lithostitched-maven.jar" \
            --write-out "Maven HTTP %{http_code}, bytes %{size_download}, final %{url_effective}\n" \
            "$SRC"
          status=$?
          if [ "$status" -eq 0 ]; then
            sha512sum "$RUNNER_TEMP/lithostitched-maven.jar"
            file "$RUNNER_TEMP/lithostitched-maven.jar"
          else
            echo "Maven probe unavailable; fallback cannot be claimed as tested on this run."
          fi
          exit 0
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Bundle Android ARM64 libc++ shared runtime
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          LIB="$(find "$NDK/toolchains/llvm/prebuilt" -path '*/aarch64-linux-android/libc++_shared.so' -type f -print -quit)"
          test -n "$LIB" && test -s "$LIB"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LIB" app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          file app/src/main/jniLibs/arm64-v8a/libc++_shared.so
      - name: Bundle experimental Android ARM64 WebRTC native for Geyser NetherNet
        run: |
          set -euo pipefail
          # Match Geyser 26.3's libdatachannel-java dependency version.
          VERSION="0.24.6.0-20261029.091642-10"
          SNAPSHOT="0.24.6.0-SNAPSHOT"
          NAME="libdatachannel-java-android-$VERSION.aar"
          URL_BASE="https://repo.opencollab.dev"
          OUT="$RUNNER_TEMP/$NAME"
          JNI="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          found=""
          for url in \
            "$URL_BASE/main/dev/opencollab/libdatachannel-java-android/$SNAPSHOT/$NAME" \
            "$URL_BASE/maven-snapshots/dev/opencollab/libdatachannel-java-android/$SNAPSHOT/$NAME" \
            "$URL_BASE/main/dev/opencollab/libdatachannel-java-android/$VERSION/$NAME"; do
            echo "Checking Android JNI artifact: $url"
            if curl --fail --location --retry 2 --connect-timeout 15 --max-time 75 -o "$OUT" "$url" && unzip -tq "$OUT" >/dev/null; then
              if unzip -Z1 "$OUT" | grep -Fxq "jni/arm64-v8a/libdatachannel-java.so"; then
                found="$url"
                break
              fi
            fi
          done
          # Some upstream versions publish the Android classifier JAR rather
          # than the combined AAR; its JNI binary is identical for our ABI.
          zip_member="jni/arm64-v8a/libdatachannel-java.so"
          if [ -z "$found" ]; then
            NAME="libdatachannel-java-$VERSION-android-arm64-v8a.jar"
            OUT="$RUNNER_TEMP/$NAME"
            for url in \
              "$URL_BASE/main/dev/opencollab/libdatachannel-java/$SNAPSHOT/$NAME" \
              "$URL_BASE/maven-snapshots/dev/opencollab/libdatachannel-java/$SNAPSHOT/$NAME" \
              "$URL_BASE/main/dev/opencollab/libdatachannel-java/$VERSION/$NAME"; do
              echo "Checking Android JNI classifier: $url"
              if curl --fail --location --retry 2 --connect-timeout 15 --max-time 75 -o "$OUT" "$url" && unzip -tq "$OUT" >/dev/null; then
                if unzip -Z1 "$OUT" | grep -Fxq "native/libdatachannel-java.so"; then
                  found="$url"
                  zip_member="native/libdatachannel-java.so"
                  break
                fi
              fi
            done
          fi
          if [ -z "$found" ]; then
            echo "::warning::Matching Android WebRTC native not found. APK builds without NetherNet JNI; Bedrock remains unsupported."
            rm -f "$OUT"
          else
            if ! curl --fail --location --connect-timeout 15 --max-time 30 -o "$OUT.sha256" "$found.sha256"; then
              echo "::warning::Upstream SHA-256 sidecar unavailable; skipping native WebRTC packaging."
            else
              expected="$(tr -d '[:space:]' < "$OUT.sha256" | tr '[:upper:]' '[:lower:]')"
              if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::warning::Bad upstream SHA-256 sidecar. Skipping native WebRTC packaging."
              else
                actual="$(sha256sum "$OUT" | cut -d ' ' -f1)"
                if [ "$expected" != "$actual" ]; then
                  echo "::error::Android WebRTC native AAR checksum mismatch"
                  exit 1
                fi
                unzip -p "$OUT" "$zip_member" > "$JNI/libdatachannel-java.so"
                test -s "$JNI/libdatachannel-java.so"
                file "$JNI/libdatachannel-java.so"
                readelf -h "$JNI/libdatachannel-java.so" | grep -q 'Machine:.*AArch64'
                if readelf -d "$JNI/libdatachannel-java.so" | grep -Fq 'libc.so.6'; then
                  echo "::error::Downloaded JNI depends on glibc rather than Android bionic"
                  exit 1
                fi
                echo "Bundled verified Android ARM64 libdatachannel-java.so for experimental Geyser JNI loading"
              fi
            fi
          fi
      - name: Compile Android WebRTC native from pinned upstream if no verified download
        if: success()
        run: |
          set -euo pipefail
          JNI="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          if [ -s "$JNI/libdatachannel-java.so" ]; then
            echo "Verified prebuilt Android WebRTC JNI already present"
            exit 0
          fi
          echo "::notice::No verified prebuilt Android WebRTC JNI; compiling upstream Android ARM64 native from source"
          SRC="$RUNNER_TEMP/pocketcraft-web-rtc"
          git clone https://github.com/opencollab-incubator/libdatachannel-java.git "$SRC"
          git -C "$SRC" checkout --detach 6be4ad71e1f10dc56a09af6daeac0e1122e23e7a
          git -C "$SRC" submodule update --init --recursive --depth 1
          cd "$SRC"
          # The exact upstream commit predates the Geyser 2026-10-29 JNI
          # snapshot. Build Android/Bionic, not Linux/glibc or Linux/musl.
          chmod +x ./gradlew
          ./gradlew compileNativeForAndroidArm64V8a \
            -Plibdatachannel.targets=android-arm64-v8a \
            -Plibdatachannel.build-release-binaries=true \
            --max-workers=4 --no-daemon --stacktrace
          native="$(find "$SRC/build/dockcross/android-arm64-v8a" -type f -name 'libdatachannel-java.so' -print -quit)"
          test -n "$native" && test -s "$native"
          cp "$native" "$JNI/libdatachannel-java.so"
          file "$JNI/libdatachannel-java.so"
          readelf -h "$JNI/libdatachannel-java.so" | grep -q 'Machine:.*AArch64'
          if readelf -d "$JNI/libdatachannel-java.so" | grep -Fq 'libc.so.6'; then
            echo "::error::WebRTC JNI is incorrectly linked to glibc, not Android bionic"
            exit 1
          fi
          echo "Successfully compiled native Android ARM64 WebRTC JNI for PocketCraft"
      - name: Require Android ARM64 WebRTC JNI before claiming a NetherNet-capable APK
        run: |
          set -euo pipefail
          JNI=app/src/main/jniLibs/arm64-v8a/libdatachannel-java.so
          if [ ! -s "$JNI" ]; then
            echo "::error::Android WebRTC native binary missing. Refusing to publish an APK as a NetherNet fix."
            exit 1
          fi
          readelf -h "$JNI" | grep -q 'Machine:.*AArch64'
          echo "Android WebRTC JNI is ready for APK packaging (real-device test still required)"
      - name: Bundle pinned Android Java 25 native runtime and JNI launcher
        run: |
          set -euo pipefail
          JRE_ARCHIVE="$RUNNER_TEMP/pocketcraft-jre25.tar.xz"
          JRE_DIR="$RUNNER_TEMP/pocketcraft-jre25"
          JNI="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JRE_DIR" "$JNI"
          curl --fail --location --retry 3 --max-time 240 --output "$JRE_ARCHIVE" \
            https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/download_jre25/jre25-android-arm64.tar.xz
          echo "d3eb7afe2240c26728a1bb440502c5f18ac3883e932d202dd7f0c9bcbbce4c37  $JRE_ARCHIVE" | sha256sum -c -
          tar -xJf "$JRE_ARCHIVE" -C "$JRE_DIR"
          count=0
          while IFS= read -r -d '' lib; do
            cp -L "$lib" "$JNI/$(basename "$lib")"
            count=$((count+1))
          done < <(find "$JRE_DIR" \( -type f -o -type l \) -name '*.so' -print0)
          test -s "$JNI/libjvm.so"
          test "$count" -gt 5
          echo "Packaged $count JRE native ELF libraries (copied into read-only APK native library directory)"
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64"
          "$NDK/bin/aarch64-linux-android28-clang" -std=c11 -D_GNU_SOURCE -fPIE -pie \
            -Wl,-z,relro,-z,now -o "$JNI/libpocketjava.so" \
            "$GITHUB_WORKSPACE/app/src/main/cpp/pocketcraft_java_bootstrap.c" -ldl
          file "$JNI/libjvm.so" "$JNI/libpocketjava.so"
      - name: Prepare persistent developer signing key
        env:
          POCKETCRAFT_KEYSTORE_BASE64: ${{ secrets.POCKETCRAFT_KEYSTORE_BASE64 }}
          POCKETCRAFT_SIGNING_PASSWORD: ${{ secrets.POCKETCRAFT_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$POCKETCRAFT_KEYSTORE_BASE64" && -n "$POCKETCRAFT_SIGNING_PASSWORD" ]]; then
            echo "$POCKETCRAFT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pocketcraft-updates.jks"
            chmod 600 "$RUNNER_TEMP/pocketcraft-updates.jks"
            keytool -list -keystore "$RUNNER_TEMP/pocketcraft-updates.jks" -storepass "$POCKETCRAFT_SIGNING_PASSWORD" -alias pocketcraft >/dev/null
            echo "POCKETCRAFT_SIGNING_KEYSTORE=$RUNNER_TEMP/pocketcraft-updates.jks" >> "$GITHUB_ENV"
            echo "POCKETCRAFT_SIGNING_PASSWORD=$POCKETCRAFT_SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "Persistent APK signing configured from GitHub Secrets"
          elif [[ -n "$POCKETCRAFT_KEYSTORE_BASE64" || -n "$POCKETCRAFT_SIGNING_PASSWORD" ]]; then
            echo "::error::Both POCKETCRAFT_KEYSTORE_BASE64 and POCKETCRAFT_SIGNING_PASSWORD must be provided."
            exit 1
          else
            echo "::warning::Persistent signing not configured. Debug APK will use runner-generated key and WILL NOT upgrade an APK signed on a different runner."
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android
      - name: Compile bundled Playit 1.2.0 for Android ARM64
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.2.0 https://github.com/playit-cloud/playit-agent.git "$RUNNER_TEMP/playit-src"
          cd "$RUNNER_TEMP/playit-src"
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/aarch64-linux-android28-clang"
          export CC_aarch64_linux_android="$NDK/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$NDK/llvm-ar"
          export CFLAGS_aarch64_linux_android="--target=aarch64-linux-android28"
          cargo build --release --locked --target aarch64-linux-android -p playit-cli -p playitd
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp target/aarch64-linux-android/release/playit-cli "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libpocketplayitcli.so"
          cp target/aarch64-linux-android/release/playitd "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libpocketplayitd.so"
          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"libpocketplayit*.so
      - name: Bundle licensed Minecraft-inspired pixel fonts
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/fonts
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/pixelifysans/PixelifySans%5Bwght%5D.ttf' \
            -o app/src/main/assets/fonts/PixelifySans.ttf
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/pressstart2p/PressStart2P-Regular.ttf' \
            -o app/src/main/assets/fonts/PressStart2P-Regular.ttf
          actual="$(git hash-object app/src/main/assets/fonts/PixelifySans.ttf)"
          test "$actual" = '2d7eb388ee499fbcf3e992723ec409c095640104' || {
            echo "::error::Pixelify Sans font hash differs from vetted source"; exit 1;
          }
          actual="$(git hash-object app/src/main/assets/fonts/PressStart2P-Regular.ttf)"
          test "$actual" = '39adf42efa597906e53be689474ac82214112124' || {
            echo "::error::Press Start 2P font hash differs from vetted source"; exit 1;
          }
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 \
            'https://raw.githubusercontent.com/IdreesInc/Monocraft/main/dist/Monocraft-ttf/Monocraft.ttf' \
            -o app/src/main/assets/fonts/Monocraft.ttf
          actual="$(git hash-object app/src/main/assets/fonts/Monocraft.ttf)"
          test "$actual" = '8b7e08a769fbe81babbecf95a9be9b5e99780ac5' || {
            echo "::error::Monocraft font hash differs from verified source"; exit 1;
          }
          test -s app/src/main/assets/licenses/Monocraft-OFL.txt
          test -s app/src/main/assets/licenses/PixelifySans-OFL.txt
          test -s app/src/main/assets/licenses/PressStart2P-OFL.txt
          echo 'Licensed, verified pixel fonts ready for offline APK packaging'
      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify ARM64 native runtime exists inside APK
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libc++_shared.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libjvm.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libpocketjava.so'
          if [ -s app/src/main/jniLibs/arm64-v8a/libdatachannel-java.so ]; then
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libdatachannel-java.so'
            echo "Verified Android WebRTC JNI is in installable APK"
          else
            echo "::warning::APK has no Android WebRTC JNI. It cannot fix NetherNet on bionic."
          fi
      - name: Verify bundled pixel fonts and third-party license notices
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -F 'assets/fonts/PixelifySans.ttf'
          unzip -l "$APK" | grep -F 'assets/fonts/PressStart2P-Regular.ttf'
          unzip -l "$APK" | grep -F 'assets/fonts/Monocraft.ttf'
          unzip -l "$APK" | grep -F 'assets/licenses/Monocraft-OFL.txt'
          unzip -l "$APK" | grep -F 'assets/licenses/PixelifySans-OFL.txt'
          unzip -l "$APK" | grep -F 'assets/licenses/PressStart2P-OFL.txt'
      - name: Verify bundled audible media sound effects
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          for name in click select server_start server_ready server_stop error; do
            unzip -l "$APK" | grep -F "res/raw/pc_${name}.wav"
          done
          echo "Six original PCM sound effects are packaged in the APK"
      - name: Verify bundled tunnel binaries
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libpocketplayitcli.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libpocketplayitd.so'
      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Check APK installability metadata and archive integrity
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          "$SDK_BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 26 "$APK"

          # aapt (not the AAPT2 resource compiler) is the stable tool for
          # APK badging output. Capture it before checking, so failed checks
          # always show the actual manifest metadata in the Actions log.
          BADGING="$RUNNER_TEMP/pocketcraft-apk-badging.txt"
          if ! "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" > "$BADGING"; then
            echo "::error::Unable to inspect APK package metadata with aapt"
            exit 1
          fi
          grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' "$BADGING" || true
          if ! grep -Fq "package: name='com.pocketcraft.server'" "$BADGING"; then
            echo "::error::Unexpected application ID. See APK metadata above."
            exit 1
          fi
          if ! grep -Eq "^sdkVersion:'[0-9]+'" "$BADGING"; then
            echo "::error::Missing valid Android minSdkVersion. See metadata above."
            exit 1
          fi

          echo "APK SHA-256: $(sha256sum "$APK" | cut -d ' ' -f1)"
          echo "APK archive, signature, zip alignment and package metadata validated"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pocketcraft-debug-apk
          path: app/build/outputs/apk/debug/*.apk


  ui-smoke:
    name: Android emulator UI smoke and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM for x86_64 Android emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Bundle the verified Monocraft font for accurate UI screenshots
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/fonts
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 \
            'https://raw.githubusercontent.com/IdreesInc/Monocraft/main/dist/Monocraft-ttf/Monocraft.ttf' \
            -o app/src/main/assets/fonts/Monocraft.ttf
          test "$(git hash-object app/src/main/assets/fonts/Monocraft.ttf)" = '8b7e08a769fbe81babbecf95a9be9b5e99780ac5'
          test -s app/src/main/assets/licenses/Monocraft-OFL.txt
      - name: Boot Android 14 emulator and run UI instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/android-ui-smoke.sh
      - name: Archive emulator screenshots, logs and instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketcraft-emulator-ui-report
          if-no-files-found: warn
          retention-days: 14
          path: |
            ui-test-output/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/

  release:
    name: Publish verified PocketCraft GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, ui-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require persistent signing for update releases
        env:
          KEYSTORE: ${{ secrets.POCKETCRAFT_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.POCKETCRAFT_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Stable signing secrets are required for releases. Never publish ephemeral debug-signed APKs as updates."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: pocketcraft-debug-apk
          path: release-dist
      - name: Prepare APK and update metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, hashlib, os
          content = Path("app/build.gradle.kts").read_text()
          name = re.search(r'versionName\s*=\s*"([^"]+)"', content).group(1)
          code = int(re.search(r"versionCode\s*=\s*(\d+)", content).group(1))
          tag = "v" + name
          if os.environ["GITHUB_REF"].startswith("refs/tags/") and os.environ["GITHUB_REF_NAME"] != tag:
              raise SystemExit("Git tag " + os.environ["GITHUB_REF_NAME"] + " does not match build version " + tag)
          source = Path("release-dist/app-debug.apk")
          if not source.is_file():
              raise SystemExit("Build artifact missing")
          target = Path("release-dist/PocketCraft-v" + name + ".apk")
          source.rename(target)
          sha = hashlib.sha256(target.read_bytes()).hexdigest()
          if re.fullmatch(r"\d+\.\d+\.\d+-(?:beta|rc)\.\d+",name):
              channel="beta"
          elif re.fullmatch(r"\d+\.\d+\.\d+",name):
              channel="stable"
          else:
              raise SystemExit("Unsupported public version: "+name)
          manifest = {
              "versionName": name,
              "versionCode": code,
              "channel": channel,
              "apkName": target.name,
              "sha256": sha
          }
          Path("release-dist/pocketcraft-update.json").write_text(
              json.dumps(manifest, indent=2) + "\n")
          print("Release metadata validated for",tag,"APK sha256:",sha)
          PY
      - name: Publish official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          RELEASE_TITLE="PocketCraft $TAG"
          RELEASE_FLAGS=()
          case "$VERSION" in
            *-beta.*|*-rc.*)
              RELEASE_TITLE="PocketCraft $TAG — Official Beta"
              RELEASE_FLAGS=(--prerelease)
              ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $TAG already published; leaving it unchanged."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Publishing release for existing tag $TAG"
            gh release create "$TAG" \
              release-dist/PocketCraft-v*.apk release-dist/pocketcraft-update.json \
              --title "$RELEASE_TITLE" \
              --notes-file CHANGELOG.md \
              "${RELEASE_FLAGS[@]}" \
              --verify-tag
          else
            echo "Creating release and tag $TAG from verified main build $GITHUB_SHA"
            gh release create "$TAG" \
              release-dist/PocketCraft-v*.apk release-dist/pocketcraft-update.json \
              --title "$RELEASE_TITLE" \
              --notes-file CHANGELOG.md \
              "${RELEASE_FLAGS[@]}" \
              --target "$GITHUB_SHA"
          fi
